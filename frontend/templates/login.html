{% extends "base.html" %}

{% block title %}เข้าสู่ระบบ{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="text-center">
            <span class="text-5xl">📚</span>
            <h2 class="mt-4 text-3xl font-bold text-gray-900">เข้าสู่ระบบ</h2>
            <p class="mt-2 text-gray-600">ยินดีต้อนรับกลับมา!</p>
        </div>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-lg sm:rounded-lg sm:px-10">
            <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-md">
                <p class="text-sm text-red-600"></p>
            </div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">อีเมล</label>
                    <input id="email" type="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500" placeholder="your@email.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">รหัสผ่าน</label>
                    <input id="password" type="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    เข้าสู่ระบบ
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-600">
                ยังไม่มีบัญชี? <a href="/register" class="text-primary-600 hover:text-primary-500 font-medium">สมัครสมาชิก</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');
        
        // In a real app, this would call Firebase Auth
        // For demo, we'll just show a message
        errorDiv.classList.remove('hidden');
        errorDiv.querySelector('p').textContent = 'ระบบยืนยันตัวตนต้องตั้งค่า Firebase - กรุณาดูเอกสารประกอบ';
    });
</script>
{% endblock %}
