<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MangaRec{% endblock %} - ระบบแนะนำมังงะและนิยาย</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <span class="text-2xl">📚</span>
                        <span class="font-bold text-xl text-primary-600 hidden sm:block">MangaRec</span>
                    </a>
                    <div class="hidden md:flex ml-10 space-x-4">
                        <a href="/search?type=manga" class="text-gray-600 hover:text-primary-600 px-3 py-2 text-sm font-medium">มังงะ</a>
                        <a href="/search?type=novel" class="text-gray-600 hover:text-primary-600 px-3 py-2 text-sm font-medium">นิยาย</a>
                        <a href="/search?type=light_novel" class="text-gray-600 hover:text-primary-600 px-3 py-2 text-sm font-medium">ไลท์โนเวล</a>
                        <a href="/search?type=webtoon" class="text-gray-600 hover:text-primary-600 px-3 py-2 text-sm font-medium">เว็บตูน</a>
                    </div>
                </div>
                
                <div class="flex-1 flex items-center justify-center px-4 max-w-lg">
                    <form action="/search" method="GET" class="w-full">
                        <div class="relative">
                            <input type="text" name="q" placeholder="ค้นหาหนังสือ..." 
                                   class="w-full bg-gray-100 rounded-full px-4 py-2 pl-10 focus:outline-none focus:ring-2 focus:ring-primary-500">
                            <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>
                    </form>
                </div>
                
                <div class="flex items-center space-x-4" id="auth-buttons">
                    <a href="/login" class="text-gray-600 hover:text-primary-600 px-4 py-2 text-sm font-medium">เข้าสู่ระบบ</a>
                    <a href="/register" class="bg-primary-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-primary-700">สมัครสมาชิก</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-white border-t mt-auto py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center text-gray-600">
                <p>© 2024 MangaRec - ระบบแนะนำมังงะและนิยาย</p>
                <p class="text-sm mt-2">พัฒนาด้วย Python/Flask ❤️</p>
            </div>
        </div>
    </footer>
    
    <script>
        const API_URL = '{{ api_url }}';
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
