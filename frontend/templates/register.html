{% extends "base.html" %}

{% block title %}สมัครสมาชิก{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="text-center">
            <span class="text-5xl">📚</span>
            <h2 class="mt-4 text-3xl font-bold text-gray-900">สมัครสมาชิก</h2>
            <p class="mt-2 text-gray-600">เริ่มต้นค้นพบหนังสือที่ใช่สำหรับคุณ</p>
        </div>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-lg sm:rounded-lg sm:px-10">
            <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-md">
                <p class="text-sm text-red-600"></p>
            </div>

            <form id="register-form" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">ชื่อผู้ใช้</label>
                    <input id="username" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500" placeholder="username">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">อีเมล</label>
                    <input id="email" type="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500" placeholder="your@email.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">รหัสผ่าน</label>
                    <input id="password" type="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500" placeholder="••••••••">
                    <p class="mt-1 text-xs text-gray-500">อย่างน้อย 6 ตัวอักษร</p>
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700">ยืนยันรหัสผ่าน</label>
                    <input id="confirm-password" type="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    สมัครสมาชิก
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-600">
                มีบัญชีอยู่แล้ว? <a href="/login" class="text-primary-600 hover:text-primary-500 font-medium">เข้าสู่ระบบ</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const errorDiv = document.getElementById('error-message');
        
        if (password !== confirmPassword) {
            errorDiv.classList.remove('hidden');
            errorDiv.querySelector('p').textContent = 'รหัสผ่านไม่ตรงกัน';
            return;
        }
        
        if (password.length < 6) {
            errorDiv.classList.remove('hidden');
            errorDiv.querySelector('p').textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
            return;
        }
        
        // In a real app, this would call Firebase Auth and then register with backend
        errorDiv.classList.remove('hidden');
        errorDiv.querySelector('p').textContent = 'ระบบยืนยันตัวตนต้องตั้งค่า Firebase - กรุณาดูเอกสารประกอบ';
    });
</script>
{% endblock %}
