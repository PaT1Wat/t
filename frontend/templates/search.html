{% extends "base.html" %}

{% block title %}ค้นหา{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex flex-col lg:flex-row gap-6">
        <!-- Filters Sidebar -->
        <div class="lg:w-64 flex-shrink-0">
            <div class="bg-white rounded-lg shadow p-4 sticky top-20">
                <h3 class="font-semibold text-gray-900 mb-4">ตัวกรอง</h3>
                
                <!-- Type Filter -->
                <div class="mb-6">
                    <h4 class="text-sm font-medium text-gray-700 mb-2">ประเภท</h4>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="radio" name="type" value="" class="filter-type h-4 w-4 text-primary-600" checked>
                            <span class="ml-2 text-sm">ทั้งหมด</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="type" value="manga" class="filter-type h-4 w-4 text-primary-600">
                            <span class="ml-2 text-sm">มังงะ</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="type" value="novel" class="filter-type h-4 w-4 text-primary-600">
                            <span class="ml-2 text-sm">นิยาย</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="type" value="light_novel" class="filter-type h-4 w-4 text-primary-600">
                            <span class="ml-2 text-sm">ไลท์โนเวล</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="type" value="webtoon" class="filter-type h-4 w-4 text-primary-600">
                            <span class="ml-2 text-sm">เว็บตูน</span>
                        </label>
                    </div>
                </div>
                
                <!-- Status Filter -->
                <div class="mb-6">
                    <h4 class="text-sm font-medium text-gray-700 mb-2">สถานะ</h4>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="radio" name="status" value="" class="filter-status h-4 w-4 text-primary-600" checked>
                            <span class="ml-2 text-sm">ทั้งหมด</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="status" value="ongoing" class="filter-status h-4 w-4 text-primary-600">
                            <span class="ml-2 text-sm">กำลังดำเนินเรื่อง</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="status" value="completed" class="filter-status h-4 w-4 text-primary-600">
                            <span class="ml-2 text-sm">จบแล้ว</span>
                        </label>
                    </div>
                </div>
                
                <!-- Rating Filter -->
                <div class="mb-6">
                    <h4 class="text-sm font-medium text-gray-700 mb-2">คะแนนขั้นต่ำ</h4>
                    <select id="filter-rating" class="w-full border rounded-md px-3 py-2 text-sm">
                        <option value="">ทั้งหมด</option>
                        <option value="4">4+ ดาว</option>
                        <option value="3">3+ ดาว</option>
                        <option value="2">2+ ดาว</option>
                    </select>
                </div>
                
                <!-- Sort -->
                <div class="mb-4">
                    <h4 class="text-sm font-medium text-gray-700 mb-2">เรียงตาม</h4>
                    <select id="filter-sort" class="w-full border rounded-md px-3 py-2 text-sm">
                        <option value="newest">ใหม่ล่าสุด</option>
                        <option value="rating">คะแนนสูงสุด</option>
                        <option value="reviews">รีวิวมากที่สุด</option>
                        <option value="title">ตามตัวอักษร</option>
                    </select>
                </div>
                
                <button onclick="applyFilters()" class="w-full bg-primary-600 text-white py-2 rounded-md hover:bg-primary-700">
                    ใช้ตัวกรอง
                </button>
            </div>
        </div>
        
        <!-- Results -->
        <div class="flex-1">
            <div class="mb-4">
                <p id="results-count" class="text-gray-600">กำลังค้นหา...</p>
            </div>
            
            <div id="search-results" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <div class="animate-pulse bg-gray-200 rounded-lg aspect-[3/4]"></div>
                <div class="animate-pulse bg-gray-200 rounded-lg aspect-[3/4]"></div>
                <div class="animate-pulse bg-gray-200 rounded-lg aspect-[3/4]"></div>
                <div class="animate-pulse bg-gray-200 rounded-lg aspect-[3/4]"></div>
            </div>
            
            <!-- Pagination -->
            <div id="pagination" class="mt-8 flex justify-center hidden">
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    const query = '{{ query }}';
    
    function createBookCard(book) {
        const typeLabels = {
            manga: 'มังงะ',
            novel: 'นิยาย',
            light_novel: 'ไลท์โนเวล',
            webtoon: 'เว็บตูน'
        };
        
        const rating = book.average_rating ? book.average_rating.toFixed(1) : '0.0';
        const coverUrl = book.cover_image_url || '';
        
        return `
            <a href="/book/${book.id}" class="group bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
                <div class="relative aspect-[3/4] bg-gray-200">
                    ${coverUrl ? 
                        `<img src="${coverUrl}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition">` :
                        `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-primary-400 to-purple-400">
                            <span class="text-white text-4xl">📚</span>
                        </div>`
                    }
                    ${book.type ? `<div class="absolute top-2 left-2">
                        <span class="bg-primary-600 text-white text-xs px-2 py-1 rounded-full">${typeLabels[book.type] || book.type}</span>
                    </div>` : ''}
                </div>
                <div class="p-4">
                    <h3 class="font-semibold text-gray-900 line-clamp-2 group-hover:text-primary-600 transition">
                        ${book.title_thai || book.title}
                    </h3>
                    ${book.author_name ? `<p class="text-sm text-gray-500 mt-1 truncate">${book.author_name_thai || book.author_name}</p>` : ''}
                    <div class="flex items-center mt-2">
                        <div class="flex items-center text-yellow-400">
                            ${'★'.repeat(Math.round(book.average_rating || 0))}${'☆'.repeat(5 - Math.round(book.average_rating || 0))}
                        </div>
                        <span class="ml-2 text-sm text-gray-600">${rating}</span>
                    </div>
                </div>
            </a>
        `;
    }
    
    async function searchBooks(page = 1) {
        const type = document.querySelector('input[name="type"]:checked')?.value || '';
        const status = document.querySelector('input[name="status"]:checked')?.value || '';
        const minRating = document.getElementById('filter-rating')?.value || '';
        const sortBy = document.getElementById('filter-sort')?.value || 'newest';
        
        let url = `${API_URL}/search/?page=${page}&limit=20`;
        if (query) url += `&q=${encodeURIComponent(query)}`;
        if (type) url += `&type=${type}`;
        if (status) url += `&status=${status}`;
        if (minRating) url += `&min_rating=${minRating}`;
        url += `&sort_by=${sortBy}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            const container = document.getElementById('search-results');
            const countEl = document.getElementById('results-count');
            
            if (data.books && data.books.length > 0) {
                container.innerHTML = data.books.map(createBookCard).join('');
                countEl.textContent = `พบ ${data.pagination.total} รายการ`;
                
                // Update pagination
                updatePagination(data.pagination);
            } else {
                container.innerHTML = `
                    <div class="col-span-4 text-center py-16">
                        <span class="text-6xl">🔍</span>
                        <h3 class="mt-4 text-xl font-semibold text-gray-900">ไม่พบผลลัพธ์</h3>
                        <p class="mt-2 text-gray-600">ลองค้นหาด้วยคำอื่น หรือปรับตัวกรอง</p>
                    </div>
                `;
                countEl.textContent = 'ไม่พบผลลัพธ์';
            }
        } catch (error) {
            console.error('Error searching:', error);
            document.getElementById('search-results').innerHTML = '<p class="col-span-4 text-center text-gray-500 py-8">ไม่สามารถโหลดข้อมูลได้</p>';
        }
    }
    
    function updatePagination(pagination) {
        const container = document.getElementById('pagination');
        if (pagination.total_pages <= 1) {
            container.classList.add('hidden');
            return;
        }
        
        container.classList.remove('hidden');
        let html = '<div class="flex items-center gap-2">';
        
        // Previous button
        html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} 
                 class="px-4 py-2 border rounded-md disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100">ก่อนหน้า</button>`;
        
        // Page numbers
        for (let i = Math.max(1, currentPage - 2); i <= Math.min(pagination.total_pages, currentPage + 2); i++) {
            html += `<button onclick="goToPage(${i})" 
                     class="px-4 py-2 rounded-md ${i === currentPage ? 'bg-primary-600 text-white' : 'border hover:bg-gray-100'}">${i}</button>`;
        }
        
        // Next button
        html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === pagination.total_pages ? 'disabled' : ''} 
                 class="px-4 py-2 border rounded-md disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100">ถัดไป</button>`;
        
        html += '</div>';
        container.innerHTML = html;
    }
    
    function goToPage(page) {
        currentPage = page;
        searchBooks(page);
        window.scrollTo(0, 0);
    }
    
    function applyFilters() {
        currentPage = 1;
        searchBooks(1);
    }
    
    // Set initial type from URL
    const urlParams = new URLSearchParams(window.location.search);
    const typeParam = urlParams.get('type');
    if (typeParam) {
        const typeRadio = document.querySelector(`input[name="type"][value="${typeParam}"]`);
        if (typeRadio) typeRadio.checked = true;
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        searchBooks();
    });
</script>
{% endblock %}
