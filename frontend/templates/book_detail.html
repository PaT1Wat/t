{% extends "base.html" %}

{% block title %}รายละเอียดหนังสือ{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="book-detail" class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="animate-pulse p-8">
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="w-full md:w-1/3 aspect-[3/4] bg-gray-200 rounded"></div>
                    <div class="flex-1 space-y-4">
                        <div class="h-8 bg-gray-200 rounded w-3/4"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                        <div class="h-20 bg-gray-200 rounded"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Reviews Section -->
        <div class="mt-8 bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">รีวิวจากผู้อ่าน</h2>
            <div id="reviews" class="space-y-4">
                <div class="animate-pulse space-y-4">
                    <div class="h-20 bg-gray-200 rounded"></div>
                    <div class="h-20 bg-gray-200 rounded"></div>
                </div>
            </div>
        </div>
        
        <!-- Similar Books -->
        <div class="mt-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">หนังสือที่คล้ายกัน</h2>
            <div id="similar-books" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <div class="animate-pulse bg-gray-200 rounded-lg aspect-[3/4]"></div>
                <div class="animate-pulse bg-gray-200 rounded-lg aspect-[3/4]"></div>
                <div class="animate-pulse bg-gray-200 rounded-lg aspect-[3/4]"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const bookId = '{{ book_id }}';
    
    const typeLabels = {
        manga: 'มังงะ',
        novel: 'นิยาย',
        light_novel: 'ไลท์โนเวล',
        webtoon: 'เว็บตูน'
    };
    
    const statusLabels = {
        ongoing: 'กำลังดำเนินเรื่อง',
        completed: 'จบแล้ว',
        hiatus: 'พักการตีพิมพ์',
        cancelled: 'ยกเลิก'
    };
    
    function renderStars(rating) {
        return '★'.repeat(Math.round(rating || 0)) + '☆'.repeat(5 - Math.round(rating || 0));
    }
    
    function createBookCard(book) {
        const rating = book.average_rating ? book.average_rating.toFixed(1) : '0.0';
        const coverUrl = book.cover_image_url || '';
        
        return `
            <a href="/book/${book.id}" class="group bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
                <div class="relative aspect-[3/4] bg-gray-200">
                    ${coverUrl ? 
                        `<img src="${coverUrl}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition">` :
                        `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-primary-400 to-purple-400">
                            <span class="text-white text-4xl">📚</span>
                        </div>`
                    }
                </div>
                <div class="p-3">
                    <h3 class="font-semibold text-gray-900 text-sm line-clamp-2">${book.title_thai || book.title}</h3>
                    <div class="flex items-center mt-1 text-yellow-400 text-xs">
                        ${renderStars(book.average_rating)}
                        <span class="ml-1 text-gray-600">${rating}</span>
                    </div>
                </div>
            </a>
        `;
    }
    
    async function loadBookDetail() {
        try {
            const response = await fetch(`${API_URL}/books/${bookId}`);
            const data = await response.json();
            
            if (data.error) {
                document.getElementById('book-detail').innerHTML = `
                    <div class="text-center py-16">
                        <h1 class="text-2xl font-bold text-gray-900 mb-4">ไม่พบหนังสือ</h1>
                        <a href="/" class="text-primary-600 hover:text-primary-700">กลับหน้าแรก</a>
                    </div>
                `;
                return;
            }
            
            const book = data.book;
            const rating = book.average_rating ? book.average_rating.toFixed(1) : '0.0';
            
            document.getElementById('book-detail').innerHTML = `
                <div class="md:flex">
                    <div class="md:w-1/3 lg:w-1/4">
                        <div class="aspect-[3/4] bg-gray-200">
                            ${book.cover_image_url ? 
                                `<img src="${book.cover_image_url}" alt="${book.title}" class="w-full h-full object-cover">` :
                                `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-primary-400 to-purple-400">
                                    <span class="text-white text-6xl">📚</span>
                                </div>`
                            }
                        </div>
                    </div>
                    <div class="md:w-2/3 lg:w-3/4 p-6">
                        <div class="flex flex-wrap items-center gap-2 mb-2">
                            ${book.type ? `<span class="bg-primary-100 text-primary-700 text-sm px-3 py-1 rounded-full">${typeLabels[book.type]}</span>` : ''}
                            ${book.status ? `<span class="bg-gray-100 text-gray-700 text-sm px-3 py-1 rounded-full">${statusLabels[book.status]}</span>` : ''}
                            ${book.is_nsfw ? `<span class="bg-red-100 text-red-700 text-sm px-3 py-1 rounded-full">18+</span>` : ''}
                        </div>
                        
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">${book.title_thai || book.title}</h1>
                        ${book.title_thai && book.title !== book.title_thai ? `<p class="text-lg text-gray-600 mb-4">${book.title}</p>` : ''}
                        
                        ${book.author_name ? `<p class="text-gray-600 mb-2">ผู้แต่ง: <a href="/search?author_id=${book.author_id}" class="text-primary-600 hover:underline">${book.author_name_thai || book.author_name}</a></p>` : ''}
                        ${book.publisher_name ? `<p class="text-gray-600 mb-4">สำนักพิมพ์: ${book.publisher_name_thai || book.publisher_name}</p>` : ''}
                        
                        <div class="flex items-center mb-4">
                            <div class="text-yellow-400 text-2xl">${renderStars(book.average_rating)}</div>
                            <span class="ml-2 text-xl font-bold text-gray-900">${rating}</span>
                            <span class="ml-2 text-gray-500">(${book.total_reviews} รีวิว)</span>
                        </div>
                        
                        ${book.genres && book.genres.length > 0 ? `
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${book.genres.map(g => `<a href="/search?genres=${encodeURIComponent(g)}" class="bg-primary-50 text-primary-700 px-3 py-1 rounded-full text-sm hover:bg-primary-100">${g}</a>`).join('')}
                            </div>
                        ` : ''}
                        
                        ${book.tags && book.tags.length > 0 ? `
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${book.tags.map(t => `<a href="/search?tags=${encodeURIComponent(t)}" class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-sm hover:bg-gray-200">#${t}</a>`).join('')}
                            </div>
                        ` : ''}
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            ${book.publication_year ? `<div class="bg-gray-50 p-3 rounded-lg"><p class="text-sm text-gray-500">ปีที่พิมพ์</p><p class="font-semibold">${book.publication_year}</p></div>` : ''}
                            ${book.total_volumes ? `<div class="bg-gray-50 p-3 rounded-lg"><p class="text-sm text-gray-500">จำนวนเล่ม</p><p class="font-semibold">${book.total_volumes}</p></div>` : ''}
                            ${book.total_chapters ? `<div class="bg-gray-50 p-3 rounded-lg"><p class="text-sm text-gray-500">จำนวนตอน</p><p class="font-semibold">${book.total_chapters}</p></div>` : ''}
                        </div>
                        
                        ${book.description_thai || book.description ? `
                            <div class="prose max-w-none">
                                <h3 class="text-lg font-semibold text-gray-900 mb-2">เรื่องย่อ</h3>
                                <p class="text-gray-700 whitespace-pre-line">${book.description_thai || book.description}</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            // Load similar books
            if (data.similar_books && data.similar_books.length > 0) {
                document.getElementById('similar-books').innerHTML = data.similar_books.map(createBookCard).join('');
            } else {
                document.getElementById('similar-books').innerHTML = '<p class="col-span-6 text-center text-gray-500 py-4">ไม่พบหนังสือที่คล้ายกัน</p>';
            }
            
            // Load reviews
            loadReviews();
            
        } catch (error) {
            console.error('Error loading book:', error);
            document.getElementById('book-detail').innerHTML = '<p class="text-center text-gray-500 py-8">ไม่สามารถโหลดข้อมูลได้</p>';
        }
    }
    
    async function loadReviews() {
        try {
            const response = await fetch(`${API_URL}/reviews/book/${bookId}`);
            const data = await response.json();
            
            const container = document.getElementById('reviews');
            
            if (data.reviews && data.reviews.length > 0) {
                container.innerHTML = data.reviews.map(review => `
                    <div class="border-b pb-4">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-primary-100 flex items-center justify-center">
                                    <span class="text-primary-600 font-medium">${(review.display_name || review.username || 'U')[0].toUpperCase()}</span>
                                </div>
                                <div>
                                    <p class="font-medium">${review.display_name || review.username}</p>
                                    <div class="flex items-center gap-2">
                                        <span class="text-yellow-400 text-sm">${renderStars(review.rating)}</span>
                                        <span class="text-sm text-gray-500">${new Date(review.created_at).toLocaleDateString('th-TH')}</span>
                                    </div>
                                </div>
                            </div>
                            ${review.is_spoiler ? '<span class="bg-orange-100 text-orange-700 text-xs px-2 py-1 rounded">สปอยล์</span>' : ''}
                        </div>
                        ${review.content ? `<p class="mt-3 text-gray-700 whitespace-pre-line">${review.content}</p>` : ''}
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">ยังไม่มีรีวิว</p>';
            }
        } catch (error) {
            console.error('Error loading reviews:', error);
            document.getElementById('reviews').innerHTML = '<p class="text-center text-gray-500 py-4">ไม่สามารถโหลดรีวิวได้</p>';
        }
    }
    
    document.addEventListener('DOMContentLoaded', loadBookDetail);
</script>
{% endblock %}
